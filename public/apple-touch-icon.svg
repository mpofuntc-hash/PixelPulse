<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Background: deep crimson red -->
  <rect width="16" height="16" fill="#c81e2c"/>

  <!-- Left tower -->
  <rect x="2" y="6" width="2" height="1" fill="#f0c040"/>
  <rect x="2" y="7" width="2" height="6" fill="#e8b830"/>
  <rect x="2" y="5" width="1" height="1" fill="#f0c040"/>
  <rect x="3" y="5" width="1" height="1" fill="#f0c040"/>

  <!-- Right tower -->
  <rect x="12" y="6" width="2" height="1" fill="#f0c040"/>
  <rect x="12" y="7" width="2" height="6" fill="#e8b830"/>
  <rect x="12" y="5" width="1" height="1" fill="#f0c040"/>
  <rect x="13" y="5" width="1" height="1" fill="#f0c040"/>

  <!-- Center tower (taller) -->
  <rect x="6" y="3" width="1" height="1" fill="#f0c040"/>
  <rect x="9" y="3" width="1" height="1" fill="#f0c040"/>
  <rect x="6" y="4" width="4" height="1" fill="#f0c040"/>
  <rect x="6" y="5" width="4" height="8" fill="#e8b830"/>

  <!-- Tower windows (dark red) -->
  <rect x="2" y="9" width="2" height="1" fill="#8b0000"/>
  <rect x="12" y="9" width="2" height="1" fill="#8b0000"/>
  <rect x="7" y="7" width="2" height="1" fill="#8b0000"/>

  <!-- Castle wall/base -->
  <rect x="4" y="9" width="2" height="4" fill="#e8b830"/>
  <rect x="10" y="9" width="2" height="4" fill="#e8b830"/>
  <rect x="4" y="8" width="8" height="1" fill="#f0c040"/>

  <!-- Wall battlements -->
  <rect x="4" y="7" width="1" height="1" fill="#f0c040"/>
  <rect x="6" y="7" width="1" height="1" fill="#f0c040"/>
  <rect x="9" y="7" width="1" height="1" fill="#f0c040"/>
  <rect x="11" y="7" width="1" height="1" fill="#f0c040"/>

  <!-- Gate/door -->
  <rect x="7" y="11" width="2" height="2" fill="#8b0000"/>

  <!-- Ground line -->
  <rect x="1" y="13" width="14" height="1" fill="#a01520"/>

  <!-- Flag on center tower -->
  <rect x="7" y="1" width="1" height="2" fill="#f0c040"/>
  <rect x="8" y="1" width="2" height="1" fill="#f0c040"/>
</svg>
